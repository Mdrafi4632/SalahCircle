<svg width="300" height="300" viewBox="190 26 300 308" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <path id="calRing" d="M 340,180 m -122,0 a 122,122 0 1,1 244,0 a 122,122 0 1,1 -244,0"/>
  </defs>

  <!-- Outer border ring only - no fill -->
  <circle cx="340" cy="180" r="144" fill="none" stroke="#c9a96e" stroke-width="2.5" opacity="0.9"/>
  <circle cx="340" cy="180" r="150" fill="none" stroke="#c9a96e" stroke-width="0.5" opacity="0.4"/>

  <!-- Arabic calligraphy -->
  <text font-family="'Amiri', Georgia, serif" font-size="16" fill="#c9a96e" opacity="0.95" letter-spacing="18">
    <textPath href="#calRing" startOffset="15%">تتبع · حفّز · انمُ</textPath>
  </text>

  <!-- Inner ring border only -->
  <circle cx="340" cy="180" r="112" fill="none" stroke="#c9a96e" stroke-width="1" opacity="0.5"/>

  <!-- Mosque base platform -->
  <rect x="282" y="217" width="116" height="9" rx="3" fill="#c9a96e" opacity="0.9"/>

  <!-- Left minaret -->
  <rect x="289" y="173" width="13" height="45" rx="2" fill="#c9a96e" opacity="0.85"/>
  <path d="M289 173 Q295 161 301 173 Z" fill="#c9a96e" opacity="0.9"/>
  <rect x="291" y="168" width="9" height="4" rx="1" fill="#e8c98a" opacity="0.9"/>
  <line x1="295" y1="168" x2="295" y2="161" stroke="#c9a96e" stroke-width="1.2"/>
  <circle cx="295" cy="160" r="2.5" fill="#e8c98a"/>

  <!-- Right minaret -->
  <rect x="378" y="173" width="13" height="45" rx="2" fill="#c9a96e" opacity="0.85"/>
  <path d="M378 173 Q384 161 391 173 Z" fill="#c9a96e" opacity="0.9"/>
  <rect x="380" y="168" width="9" height="4" rx="1" fill="#e8c98a" opacity="0.9"/>
  <line x1="385" y1="168" x2="385" y2="161" stroke="#c9a96e" stroke-width="1.2"/>
  <circle cx="385" cy="160" r="2.5" fill="#e8c98a"/>

  <!-- Main dome -->
  <path d="M298 198 Q298 153 340 145 Q382 153 382 198 Z" fill="#c9a96e" opacity="0.9"/>
  <path d="M312 183 Q320 159 340 154 Q330 163 320 178 Z" fill="#e8c98a" opacity="0.4"/>

  <!-- Dome finial -->
  <line x1="340" y1="145" x2="340" y2="133" stroke="#c9a96e" stroke-width="1.5"/>

  <!-- Crescent -->
  <circle cx="340" cy="126" r="9" fill="#c9a96e"/>
  <circle cx="344" cy="124" r="7" fill="white" opacity="0.15"/>
  <circle cx="344" cy="124" r="7" fill="none" stroke="#c9a96e" stroke-width="0"/>

  <!-- Star -->
  <circle cx="352" cy="118" r="2" fill="#e8c98a"/>
</svg>
